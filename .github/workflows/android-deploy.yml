name: Android Deploy
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Make envfile
        run: |
          echo "GPF_key=${{ secrets.GPF_key }}" > .env
          echo "signalement_url=${{ secrets.SIGNALEMENT_URL }}" >> .env
          echo "osm_bearer_token=${{ secrets.OSM_BEARER_TOKEN }}" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Sync
        run: npx cap sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: check android build tools
        run: |
          ls /usr/local/lib/android/sdk/build-tools/

      - name: Build Android Release Bundle
        run: cd android && ./gradlew bundleRelease

      - name: Sign Release Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_bundle
        with:
          releaseDirectory: android/app/build/outputs/bundle/googleRelease
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ steps.sign_bundle.outputs.signedReleaseFile }}
          retention-days: 3


      - name: Deploy to PlayStore
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: fr.ign.geoportail
          releaseFiles: ${{ steps.sign_bundle.outputs.signedReleaseFile }}
          tracks: internal
          status: completed
          inAppUpdatePriority: 5
